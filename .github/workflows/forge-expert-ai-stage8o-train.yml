name: Forge Expert AI Stage 8O — Combined Outcome Training

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stage8o_outcome_policy.py'
      - 'test_stage8o_outcome_policy.py'
      - 'STAGE8O_COMBINED_OUTCOME_POLICY.md'
      - '.github/workflows/forge-expert-ai-stage8o-train.yml'

permissions:
  contents: read
  actions: read

jobs:
  development-only-outcome-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate learner and inherited public-only safety
        run: |
          python -m unittest -v \
            test_stage8o_outcome_policy \
            test_stage8n_outcome_trajectories \
            test_stage8l_outcome_trajectories
      - name: Retrieve the two pinned successful development corpora
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11491113213" --jq '.digest')" = "sha256:4179dbe7bd26bcb745efd9d5da800342f13638a85dd6abd97f449bf3d29a1d7c"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11495733848" --jq '.digest')" = "sha256:36037df0152a57fc6117f5cf91dcaa4cb3fd26288e4b07d6ce2028cffe93062e"
          gh run download 37637623265 -n stage8l-public-outcome-trajectories -D input-8l
          gh run download 37646582768 -n stage8n-public-exploration-corpus -D input-8n
          test -s input-8l/stage8l-outcome-trajectories.jsonl
          test -s input-8n/stage8n-outcome-trajectories.jsonl
          python - <<'PY'
          import json
          a=json.load(open('input-8l/stage8l-outcome-trajectory-manifest.json'))
          b=json.load(open('input-8n/stage8n-outcome-trajectory-manifest.json'))
          assert a['games']==8 and a['trajectory_rows']==115
          assert b['games']==16 and b['trajectory_rows']==216
          assert a['reserved_untouched_evaluation_seed_families']==[20261032,20261033]
          assert b['reserved_untouched_evaluation_seed_families']==[20261032,20261033]
          assert a['model_input_contains_hidden_information'] is False
          assert b['model_input_contains_hidden_information'] is False
          assert a['forge_referee'] is True and b['forge_referee'] is True
          assert a['promotion_allowed'] is False and b['promotion_allowed'] is False
          PY
      - name: Train conservative Stage 8O model
        run: |
          set -euo pipefail
          python stage8o_outcome_policy.py \
            input-8l/stage8l-outcome-trajectories.jsonl \
            input-8n/stage8n-outcome-trajectories.jsonl \
            --checkpoint stage8o-checkpoint.json \
            --report stage8o-report.json
          PYTHONHASHSEED=812 python stage8o_outcome_policy.py \
            input-8l/stage8l-outcome-trajectories.jsonl \
            input-8n/stage8n-outcome-trajectories.jsonl \
            --checkpoint stage8o-checkpoint-repeat.json \
            --report stage8o-report-repeat.json
          cmp stage8o-checkpoint.json stage8o-checkpoint-repeat.json
          cmp stage8o-report.json stage8o-report-repeat.json
      - name: Enforce development-only safety and reproducibility gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from stage8o_outcome_policy import load
          m=json.load(open('stage8o-checkpoint.json'))
          r=json.load(open('stage8o-report.json'))
          assert m['training_rows']==r['training_rows']==331
          assert m['training_games']==r['training_games']==24
          assert m['training_seeds']==[*range(20261028,20261032),*range(20261034,20261042)]
          assert m['reserved_untouched_evaluation_seeds']==[20261032,20261033]
          assert not r['reserved_evaluation_opened']
          assert m['promotion_allowed'] is False and r['promotion_allowed'] is False
          assert m['broader_learned_control_allowed'] is False
          assert len(r['cross_validation']['folds'])==12
          assert load(Path('stage8o-checkpoint.json'))['model_id']==m['model_id']
          print('Stage 8O model:',m['model_id'])
          print('Stage 8O model CV:',r['cross_validation']['model'])
          print('Stage 8O baseline CV:',r['cross_validation']['constant_baseline'])
          print('Stage 8O development quality gate:',r['cross_validation']['development_gate_passed'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage8o-conservative-outcome-dev
          path: |
            stage8o-checkpoint.json
            stage8o-report.json
      - name: Require improvement over the constant baseline on both metrics
        run: |
          python - <<'PY'
          import json
          r=json.load(open('stage8o-report.json'))
          assert r['cross_validation']['development_gate_passed'], (
              'Stage 8O development quality gate failed: do not open reserved evaluation seeds')
          PY
