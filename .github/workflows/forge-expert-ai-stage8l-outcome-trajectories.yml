name: Forge Expert AI Stage 8L — Outcome Trajectories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stage8l_outcome_trajectories.py'
      - 'test_stage8l_outcome_trajectories.py'
      - 'STAGE8L_OUTCOME_TRAJECTORIES.md'
      - '.github/workflows/forge-expert-ai-stage8l-outcome-trajectories.yml'

permissions:
  contents: read
  actions: read

jobs:
  outcome-trajectories:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify predeclared Stage 8L protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('STAGE8L_OUTCOME_TRAJECTORIES.md').read_text()
          for seed in ('20261028','20261029','20261030','20261031'):
              assert seed in text
          for seed in ('20261032','20261033'):
              assert seed in text
          assert 'must not be run during Stage 8L' in text
          assert 'at least **4 learned-return-boundary behavior rows**' in text
          assert 'at least **1 learned-return-boundary behavior row is targeted**' in text
          assert 'training_performed=false' in text
          assert 'promotion_allowed=false' in text
          assert 'broader_learned_control_allowed=false' in text
          PY

      - name: Test Stage 8L data safety contract
        run: |
          python -m unittest -v \
            test_stage8l_outcome_trajectories \
            test_stage8k_return_boundary_intervention \
            test_stage8j_single_intervention \
            test_stage8i_control_replay \
            test_stage8h_lifecycle_audit \
            test_stage8f_acceptance_audit \
            test_stage8e_returned_action_audit \
            test_stage8d_shadow_policy \
            test_stage8c_target_features
          python -m py_compile \
            stage8l_outcome_trajectories.py \
            test_stage8l_outcome_trajectories.py

      - name: Retrieve frozen Stage 8D checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11405356263" --jq '.digest')" = "sha256:fdb467e0fffe365011186de647f99d38dff269281b0d2ed20748db41c9c0929d"
          gh run download 37449513507 -n stage8d-frozen-shadow-replay -D frozen-shadow
          test -s frozen-shadow/shadow-model.json
          python - <<'PY'
          import json
          model=json.load(open('frozen-shadow/shadow-model.json'))
          assert model['model_id']=='6c4dd27f364aaa6c9e9100f88eb323eaa419dab0a49845ee0f748b9998746288'
          assert model['promotion_allowed'] is False
          PY

      - name: Export unchanged decks
        run: python forge_export.py --user-dir "$HOME/.forge"

      - name: Record deck hashes
        run: |
          sha256sum \
            "$HOME/.forge/decks/constructed/ST Forge Full.dck" \
            "$HOME/.forge/decks/constructed/Benchmark Red Forge.dck" \
            | tee stage8l-deck-sha256.txt

      - name: Clone pinned Forge 2.0.15
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src

      - name: Apply expert-AI patches through Stage 8K
        run: |
          python patch_forge_expert_cli.py forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python patch_forge_information_set.py forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          python patch_forge_infoset_ensemble.py \
            --game-simulator forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_complete_action_identity.py forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java
          python patch_forge_strategy_fusion_audit.py \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage7_legal_extractor.py forge-src/forge-ai/src/main/java
          python patch_forge_stage7_dataset_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8_counterfactual_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8e_execution_binding.py \
            --plan forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8f_acceptance_binding.py \
            --forge-ai-java forge-src/forge-ai/src/main/java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java \
            --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java
          python patch_forge_stage8h_lifecycle.py \
            --forge-game-java forge-src/forge-game/src/main/java \
            --expert-bridge forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertActionAuditBridge.java \
            --computer-util forge-src/forge-ai/src/main/java/forge/ai/ComputerUtil.java \
            --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java \
            --magic-stack forge-src/forge-game/src/main/java/forge/game/zone/MagicStack.java
          python patch_forge_stage8i_control_adapter.py \
            --forge-ai-java forge-src/forge-ai/src/main/java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8j_sparse_control.py \
            --adapter forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertPolicyControlAdapter.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8k_return_boundary_control.py \
            --adapter forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertPolicyControlAdapter.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java

      - name: Build patched Forge
        working-directory: forge-src
        run: |
          mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip=true package
          FORGE_JAR="$(find forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          test -n "$FORGE_JAR"
          echo "FORGE_JAR=$(realpath "$FORGE_JAR")" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$(realpath forge-gui)" >> "$GITHUB_ENV"

      - name: Re-run inherited real-Forge safety regressions
        run: |
          javac -cp "$FORGE_JAR" -d stage8l-regression \
            validation/Stage6RootIdentityRegression.java \
            validation/Stage8TargetSemanticsRegression.java \
            validation/Stage8IBoundedControlRegression.java \
            validation/Stage8JSparseControlRegression.java \
            validation/Stage8KReturnBoundaryRegression.java
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage6RootIdentityRegression
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8TargetSemanticsRegression
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8IBoundedControlRegression valid
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8IBoundedControlRegression invalid
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8JSparseControlRegression missing
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8JSparseControlRegression valid
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8JSparseControlRegression wrong-actor
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression missing
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression valid
          java -cp "stage8l-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression wrong-forge

      - name: Capture Stage 8L Forge-only baselines and freeze interventions
        shell: bash
        run: |
          set -euo pipefail
          for SEED in 20261028 20261029 20261030 20261031; do
            for ORIENTATION in st-first red-first; do
              if [ "$ORIENTATION" = st-first ]; then
                DECK_A="ST Forge Full.dck"
                DECK_B="Benchmark Red Forge.dck"
                MATCHUP="st-vs-benchmark-red"
              else
                DECK_A="Benchmark Red Forge.dck"
                DECK_B="ST Forge Full.dck"
                MATCHUP="benchmark-red-vs-st"
              fi

              cd "$FORGE_HOME"
              java -Xmx12g \
                -Dforge.expert.infoset=true \
                -Dforge.expert.infoset.samples=3 \
                -Dforge.expert.stage7.dataset=true \
                -Dforge.expert.stage8.capture=true \
                -Dforge.expert.stage8.execution=true \
                -Dforge.expert.stage8.acceptance=true \
                -Dforge.expert.stage8.lifecycle=true \
                -Dforge.expert.stage7.matchup="$MATCHUP" \
                -jar "$FORGE_JAR" sim \
                -D "$HOME/.forge/decks/constructed" \
                -d "$DECK_A" "$DECK_B" \
                -x full default -n 1 -s "$SEED" -q -c 600 \
                > "$GITHUB_WORKSPACE/stage8l-baseline-$ORIENTATION-$SEED.log" 2>&1
              cd "$GITHUB_WORKSPACE"

              python stage8k_return_boundary_intervention.py plan \
                frozen-shadow/shadow-model.json \
                "stage8l-baseline-$ORIENTATION-$SEED.log" \
                --actor-prefix 'Ai(1)-' \
                --output "stage8l-$ORIENTATION-$SEED.requests.tsv" \
                --metadata "stage8l-$ORIENTATION-$SEED.plan.json"
            done
          done

      - name: Run bounded Stage 8L exploration games
        shell: bash
        run: |
          set -euo pipefail
          for SEED in 20261028 20261029 20261030 20261031; do
            for ORIENTATION in st-first red-first; do
              if [ "$ORIENTATION" = st-first ]; then
                DECK_A="ST Forge Full.dck"
                DECK_B="Benchmark Red Forge.dck"
                MATCHUP="st-vs-benchmark-red"
              else
                DECK_A="Benchmark Red Forge.dck"
                DECK_B="ST Forge Full.dck"
                MATCHUP="benchmark-red-vs-st"
              fi
              REQUEST_FILE="$GITHUB_WORKSPACE/stage8l-$ORIENTATION-$SEED.requests.tsv"

              cd "$FORGE_HOME"
              if [ -s "$REQUEST_FILE" ]; then
                java -Xmx12g \
                  -Dforge.expert.infoset=true \
                  -Dforge.expert.infoset.samples=3 \
                  -Dforge.expert.stage7.dataset=true \
                  -Dforge.expert.stage8.capture=true \
                  -Dforge.expert.stage8.execution=true \
                  -Dforge.expert.stage8.acceptance=true \
                  -Dforge.expert.stage8.lifecycle=true \
                  -Dforge.expert.stage8.control=true \
                  -Dforge.expert.stage8.control.return_boundary=true \
                  -Dforge.expert.stage8.control.file="$REQUEST_FILE" \
                  -Dforge.expert.stage8.control.require_forge_match=false \
                  -Dforge.expert.stage8.control.allow_missing=true \
                  "-Dforge.expert.stage8.control.actor_prefix=Ai(1)-" \
                  -Dforge.expert.stage7.matchup="$MATCHUP" \
                  -jar "$FORGE_JAR" sim \
                  -D "$HOME/.forge/decks/constructed" \
                  -d "$DECK_A" "$DECK_B" \
                  -x full default -n 1 -s "$SEED" -q -c 600 \
                  > "$GITHUB_WORKSPACE/stage8l-controlled-$ORIENTATION-$SEED.log" 2>&1
              else
                java -Xmx12g \
                  -Dforge.expert.infoset=true \
                  -Dforge.expert.infoset.samples=3 \
                  -Dforge.expert.stage7.dataset=true \
                  -Dforge.expert.stage8.capture=true \
                  -Dforge.expert.stage8.execution=true \
                  -Dforge.expert.stage8.acceptance=true \
                  -Dforge.expert.stage8.lifecycle=true \
                  -Dforge.expert.stage7.matchup="$MATCHUP" \
                  -jar "$FORGE_JAR" sim \
                  -D "$HOME/.forge/decks/constructed" \
                  -d "$DECK_A" "$DECK_B" \
                  -x full default -n 1 -s "$SEED" -q -c 600 \
                  > "$GITHUB_WORKSPACE/stage8l-controlled-$ORIENTATION-$SEED.log" 2>&1
              fi
              cd "$GITHUB_WORKSPACE"
            done
          done

      - name: Revalidate Stage 8K return-boundary gate on exploration games
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from stage8d_shadow_policy import load_checkpoint
          from stage8k_return_boundary_intervention import compare_pair, aggregate

          actor='Ai(1)-'
          policy=load_checkpoint(Path('frozen-shadow/shadow-model.json'))
          pairs=[]
          for seed in (20261028, 20261029, 20261030, 20261031):
              for orientation in ('st-first', 'red-first'):
                  pairs.append(compare_pair(
                      policy,
                      Path(f'stage8l-baseline-{orientation}-{seed}.log'),
                      Path(f'stage8l-controlled-{orientation}-{seed}.log'),
                      Path(f'stage8l-{orientation}-{seed}.plan.json'),
                      Path(f'stage8l-{orientation}-{seed}.requests.tsv'),
                      actor,
                  ))
          report=aggregate(
              pairs,
              minimum_interventions=4,
              minimum_targeted_interventions=1,
          )
          Path('stage8l-return-boundary-safety.json').write_text(
              json.dumps(report, sort_keys=True, indent=2)+'\n'
          )
          assert report['safety_gate_passed'] is True
          assert report['promotion_allowed'] is False
          assert report['broader_learned_control_allowed'] is False
          assert report['forge_referee'] is True
          assert report['totals']['games']==8
          assert report['totals']['interventions_applied']>=4
          assert report['totals']['targeted_interventions_applied']>=1
          assert report['totals']['lifecycle_anomalies']==0
          print('Stage 8L inherited return-boundary gate:', report['totals'])
          PY

      - name: Collect public-only outcome trajectories
        run: |
          python stage8l_outcome_trajectories.py \
            stage8l-controlled-st-first-20261028.log \
            stage8l-controlled-red-first-20261028.log \
            stage8l-controlled-st-first-20261029.log \
            stage8l-controlled-red-first-20261029.log \
            stage8l-controlled-st-first-20261030.log \
            stage8l-controlled-red-first-20261030.log \
            stage8l-controlled-st-first-20261031.log \
            stage8l-controlled-red-first-20261031.log \
            --output stage8l-outcome-trajectories.jsonl \
            --manifest stage8l-outcome-trajectory-manifest.json

      - name: Audit Stage 8L dataset gate
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          manifest=json.load(open('stage8l-outcome-trajectory-manifest.json'))
          rows=[json.loads(line) for line in open('stage8l-outcome-trajectories.jsonl') if line.strip()]
          assert manifest['schema_version']=='stage8l-outcome-trajectory-manifest-v1'
          assert manifest['games']==8
          assert manifest['trajectory_rows']==len(rows) and rows
          assert manifest['exploration_seed_families']==[20261028,20261029,20261030,20261031]
          assert manifest['reserved_untouched_evaluation_seed_families']==[20261032,20261033]
          assert manifest['model_input_contains_search_scores'] is False
          assert manifest['model_input_contains_terminal_outcomes'] is False
          assert manifest['model_input_contains_hidden_information'] is False
          assert manifest['forge_referee'] is True
          assert manifest['training_performed'] is False
          assert manifest['promotion_allowed'] is False
          assert manifest['broader_learned_control_allowed'] is False

          seeds={row['audit']['run_seed'] for row in rows}
          assert seeds=={20261028,20261029,20261030,20261031}
          assert not ({20261032,20261033} & seeds)
          learned=[row for row in rows if row['behavior_source']=='learned-return-boundary']
          assert len(learned)>=4
          assert sum(row['behavior_action_targeted'] for row in learned)>=1
          assert all(row['audit']['forge_referee'] is True for row in rows)
          assert all(row['audit']['hidden_information_fields']==0 for row in rows)
          sources=Counter(row['behavior_source'] for row in rows)
          print('Stage 8L rows:', len(rows))
          print('Stage 8L behavior sources:', dict(sources))
          print('Stage 8L learned targeted rows:', sum(row['behavior_action_targeted'] for row in learned))
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage8l-public-outcome-trajectories
          path: |
            stage8l-outcome-trajectories.jsonl
            stage8l-outcome-trajectory-manifest.json
            stage8l-return-boundary-safety.json
            stage8l-deck-sha256.txt
            stage8l-*.plan.json
            stage8l-*.requests.tsv
            stage8l-baseline-*.log
            stage8l-controlled-*.log
