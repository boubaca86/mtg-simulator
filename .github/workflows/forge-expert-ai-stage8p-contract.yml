name: Forge Expert AI Stage 8P — Contract
on:
  pull_request:
  push:
    branches: [main, expert-stage8p-reserved-evaluation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile stage8p_reserved_*.py
      - run: python -m unittest -v test_stage8p_reserved
