name: Forge Expert AI Stage 8P — Contract
on:
  pull_request:
  push:
    branches: [main, expert-stage8p-reserved-evaluation, expert-stage8p-one-shot-seed-guard]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m py_compile stage8p_*.py test_stage8p_*.py
      - name: Verify reserved planner and full controlled-game audit contract
        run: |
          python -m unittest -v test_stage8p_one_shot_guard test_stage8p_workflow_contract test_stage8p_reserved test_stage8o_outcome_policy test_stage8k_return_boundary_intervention test_stage8h_lifecycle_audit test_stage8f_acceptance_audit test_stage8e_returned_action_audit test_stage8d_shadow_policy
