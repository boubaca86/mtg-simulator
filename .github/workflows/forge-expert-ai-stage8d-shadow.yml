name: Forge Expert AI Stage 8D — Frozen Shadow Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stage8d_shadow_policy.py'
      - 'stage8d_shadow_replay.py'
      - 'test_stage8d_shadow_policy.py'
      - 'stage8c_target_features.py'
      - 'stage8_ranker_features.py'
      - 'stage8_action_ranker.py'
      - '.github/workflows/forge-expert-ai-stage8d-shadow.yml'

permissions:
  contents: read
  actions: read

jobs:
  frozen-shadow-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test label-free shadow inference
        run: python -m unittest -v test_stage8d_shadow_policy test_stage8c_target_features
      - name: Retrieve pinned development and confirmation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11385157491" --jq '.digest')" = "sha256:114369fdb621ba6d05e1ee35b7166113122a924d2c67b38819bfb4634f38494c"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11404017116" --jq '.digest')" = "sha256:eb8c6c38de8a18a009bfec3f44d1875dcca4f3d6f8ca7183ad819e4fc8822d3a"
          gh run download 37399134353 -n stage7b-live-labeled-baseline -D development
          gh run download 37445803768 -n stage8c-fresh-seed-replication -D confirmation
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('confirmation/stage8c-fresh-counterfactual.jsonl')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'b4e595609f297d926bce7f7bcfb73823701258395f646db859da918444f71580'
          r=json.loads(Path('confirmation/stage8c-fresh-seed-report.json').read_text())
          assert r['primary_contrast']['positive_replication'] is True
          assert r['promotion_allowed'] is False
          PY
      - name: Export frozen development-only model
        run: |
          python stage8d_shadow_policy.py export development/stage8a-counterfactual.jsonl --output shadow-model.json
          PYTHONHASHSEED=412 python stage8d_shadow_policy.py export development/stage8a-counterfactual.jsonl --output shadow-model-repeat.json
          cmp shadow-model.json shadow-model-repeat.json
      - name: Audit complete logs and reproduce frozen predictions
        run: |
          python stage8d_shadow_replay.py shadow-model.json confirmation --output-dir shadow-results
          python stage8d_shadow_policy.py observe shadow-model.json < confirmation/stage8c-fresh-st-first-20261012.log > shadow-results/stream-sample.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('shadow-results/report.json').read_text())
          assert r['proposals_scored'] == r['coverage']['captured_proposals'] == 820
          assert r['coverage']['captured_games'] == 32
          assert r['frozen_model_metrics_reproduced_exactly'] is True
          assert r['source_logs_unchanged'] is True
          assert r['promotion_allowed'] is False
          stream=[json.loads(x) for x in Path('shadow-results/stream-sample.jsonl').read_text().splitlines()]
          replay=[json.loads(x) for x in Path('shadow-results/recommendations.jsonl').read_text().splitlines()
                  if json.loads(x)['source_log']=='stage8c-fresh-st-first-20261012.log']
          for row in replay:
              row.pop('source_log'); row.pop('game_group')
              row['source_validation']='pending whole-log audit'
          assert stream == replay
          print('All 820 source proposals scored; rankable predictions match the frozen experiment exactly.')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: stage8d-frozen-shadow-replay
          path: |
            shadow-model.json
            shadow-results/report.json
            shadow-results/recommendations.jsonl
            shadow-results/stream-sample.jsonl
