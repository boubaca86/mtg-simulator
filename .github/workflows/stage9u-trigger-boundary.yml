name: Stage 9U - Mandatory and Optional Trigger Boundary

# Disposable pinned-Forge tests only. No pilot dispatch or reserved seed use.
on:
  push:
    branches:
      - expert-stage9u-trigger-boundary
    paths:
      - .github/workflows/stage9u-trigger-boundary.yml
      - forge_tests/Stage9TGuardedConfirmTest.java
      - forge_tests/Stage9UTriggerBoundaryTest.java
      - forge_tests/verify_stage9t_surefire.py
      - forge_tests/verify_stage9u_surefire.py
      - forge_tests/test_verify_stage9u_surefire.py
      - stage9o/combat_actor.py
  pull_request:
    paths:
      - .github/workflows/stage9u-trigger-boundary.yml
      - forge_tests/Stage9TGuardedConfirmTest.java
      - forge_tests/Stage9UTriggerBoundaryTest.java
      - forge_tests/verify_stage9t_surefire.py
      - forge_tests/verify_stage9u_surefire.py
      - forge_tests/test_verify_stage9u_surefire.py
      - stage9o/combat_actor.py

permissions:
  contents: read

jobs:
  pinned-forge-trigger-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STAGE9T_WORKER: ${{ github.workspace }}/stage9o/combat_actor.py
    steps:
      - name: Checkout proposed change without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact Forge release
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: forge-2.0.15
          path: forge-src
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
      - name: Verify upstream pin and stage both Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage9u-evidence
          test "$(git -C forge-src rev-parse HEAD)" = 4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676
          git -C forge-src rev-parse HEAD > stage9u-evidence/forge-sha.txt
          git rev-parse HEAD > stage9u-evidence/feature-sha.txt
          python3 -m unittest -v forge_tests.test_verify_stage9u_surefire
          sha256sum forge_tests/Stage9TGuardedConfirmTest.java \
            forge_tests/Stage9UTriggerBoundaryTest.java forge_tests/verify_stage9t_surefire.py \
            forge_tests/verify_stage9u_surefire.py forge_tests/test_verify_stage9u_surefire.py \
            stage9o/combat_actor.py > stage9u-evidence/source-hashes.txt
          for source in Stage9TGuardedConfirmTest Stage9UTriggerBoundaryTest; do
            install -m 0644 "forge_tests/$source.java" \
              "forge-src/forge-gui-desktop/src/test/java/forge/ai/$source.java"
          done
      - name: Run trigger cases and all inherited gameplay regressions
        shell: bash
        run: |
          set -euo pipefail
          cd forge-src
          rm -rf forge-gui-desktop/target/surefire-reports
          set +e
          xvfb-run -a mvn -B -ntp -pl forge-gui-desktop -am test \
            -Dtest=Stage9UTriggerBoundaryTest -Dsurefire.failIfNoSpecifiedTests=false \
            > "$GITHUB_WORKSPACE/stage9u-evidence/maven.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$GITHUB_WORKSPACE/stage9u-evidence/maven-exit.txt"
          if [ -d forge-gui-desktop/target/surefire-reports ]; then
            cp -R forge-gui-desktop/target/surefire-reports "$GITHUB_WORKSPACE/stage9u-evidence/surefire"
          fi
          echo "Forge Maven exit: $code"
          tail -n 100 "$GITHUB_WORKSPACE/stage9u-evidence/maven.log"
          test "$code" -eq 0
      - name: Require all thirty-one named methods with no failures or skips
        shell: bash
        run: |
          set -euo pipefail
          python3 -m forge_tests.verify_stage9u_surefire \
            --reports stage9u-evidence/surefire | tee stage9u-evidence/gate.json
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9u-trigger-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage9u-evidence
          if-no-files-found: error
          retention-days: 14
