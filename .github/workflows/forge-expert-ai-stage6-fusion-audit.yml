name: Forge Expert AI Stage 6 — Live Fusion Audit

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Audit games"
        required: true
        default: "20"
      seed:
        description: "Forge RNG seed"
        required: true
        default: "20261004"
  push:
    branches: [main]
    paths:
      - ".github/workflows/forge-expert-ai-stage6-fusion-audit.yml"
      - "patch_forge_strategy_fusion_audit.py"
      - "patch_forge_complete_action_identity.py"

permissions:
  contents: read

jobs:
  fusion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Export decks
        run: python3 forge_export.py --user-dir "$HOME/.forge"
      - name: Clone pinned Forge
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src
      - name: Apply Stage 3-6 patches
        run: |
          python3 patch_forge_expert_cli.py forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python3 patch_forge_information_set.py forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          python3 patch_forge_infoset_ensemble.py --game-simulator forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python3 patch_forge_complete_action_identity.py forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java
          python3 patch_forge_strategy_fusion_audit.py --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          grep -n "getBestRootActionIdentity" forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java
          grep -n "EXPERT_INFOSET_STRATEGY_FUSION" forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          grep -n "EXPERT_INFOSET_AUDITED_CANDIDATE" forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
      - name: Build patched Forge
        working-directory: forge-src
        run: |
          mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip=true package
          FORGE_JAR="$(find forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          echo "FORGE_JAR=$(realpath "$FORGE_JAR")" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$(realpath forge-gui)" >> "$GITHUB_ENV"
      - name: Run live multi-world audit
        shell: bash
        run: |
          set -o pipefail
          cd "$FORGE_HOME"
          java -Xmx6g -Dforge.expert.infoset=true -Dforge.expert.infoset.samples=3 -jar "$FORGE_JAR" sim \
            -D "$HOME/.forge/decks/constructed" -d "ST Forge Full.dck" "Benchmark Red Forge.dck" \
            -x full default -n "${{ inputs.games || '20' }}" -s "${{ inputs.seed || '20261004' }}" -q -c 180 \
            2>&1 | tee "$GITHUB_WORKSPACE/stage6-fusion-audit.log"
      - name: Verify Stage 6 regression gate
        env:
          EXPECTED_GAMES: ${{ inputs.games || '20' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          from stage7_label_outcomes import AUDIT
          text = Path('stage6-fusion-audit.log').read_text()
          games = [int(x) for x in re.findall(r'^Game Result: Game (\d+) ', text, re.M)]
          assert games == list(range(1, int(os.environ['EXPECTED_GAMES']) + 1)), games
          assert 'Stopping slow match as draw' not in text, 'timeout invalidates this corpus'
          assert not re.search(r'Exception in thread|java\.[\w.]+(?:Exception|Error)', text), 'Forge execution error'
          assert 'EXPERT_INFOSET_STRATEGY_FUSION:' not in text, 'hidden worlds selected different root actions'
          audits = [AUDIT.fullmatch(line) for line in text.splitlines() if line.startswith('EXPERT_INFOSET_AUDITED_CANDIDATE:')]
          assert audits, 'no audited complete actions'
          assert all(a and tuple(map(int, a.groups())) == (3, 3) for a in audits), 'incomplete three-world coverage'
          print(f'Completed {len(games)} games; fully audited {len(audits)} candidates; zero observed divergences or timeouts.')
          print('Diagnostic corpus gate only: complete-action replay/aggregation is still required.')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage6-fusion-audit
          path: stage6-fusion-audit.log
