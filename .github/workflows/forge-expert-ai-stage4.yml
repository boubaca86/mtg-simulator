name: Forge Expert AI Stage 4 — Information Boundary

on:
  workflow_dispatch:
    inputs:
      games_per_arm:
        description: "Games for raw-full and information-set-full arms"
        required: true
        default: "10"
      seed:
        description: "Forge RNG seed"
        required: true
        default: "20261004"

permissions:
  contents: write

concurrency:
  group: forge-expert-ai-stage4
  cancel-in-progress: false

env:
  FORGE_TAG: "forge-2.0.15"
  GAMES_PER_ARM: "${{ inputs.games_per_arm }}"
  FORGE_SEED: "${{ inputs.seed }}"

jobs:
  infoset-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout simulator repository
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Export full S.T custom set and decks
        run: python3 forge_export.py --user-dir "$HOME/.forge"

      - name: Clone Forge source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FORGE_TAG" https://github.com/Card-Forge/forge.git forge-src
          test -f forge-src/pom.xml

      - name: Patch Forge search CLI and information boundary
        run: |
          set -euo pipefail
          python3 patch_forge_expert_cli.py \
            forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python3 patch_forge_information_set.py \
            forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          grep -n "AI search mode per player" \
            forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          grep -n "determinizeOpponentHiddenInformation" \
            forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java

      - name: Build patched Forge
        working-directory: forge-src
        run: |
          set -euo pipefail
          mvn -B -pl forge-gui-desktop -am \
            -DskipTests \
            -Dcheckstyle.skip=true \
            package

          FORGE_JAR="$(find forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          if [ -z "$FORGE_JAR" ]; then
            echo "Patched Forge desktop jar was not found."
            exit 1
          fi

          FORGE_JAR="$(realpath "$FORGE_JAR")"
          FORGE_HOME="$(realpath forge-gui)"
          test -f "$FORGE_HOME/res/languages/en-US.properties"

          echo "FORGE_JAR=$FORGE_JAR" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$FORGE_HOME" >> "$GITHUB_ENV"

      - name: Run raw-full versus information-set-full comparison
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="$GITHUB_WORKSPACE/results/forge_expert_ai_stage4"
          rm -rf "$RESULTS"
          mkdir -p "$RESULTS"

          run_arm() {
            local key="$1"
            local infoset="$2"
            local jvm_flag="-Dforge.expert.infoset=false"
            if [ "$infoset" = "true" ]; then
              jvm_flag="-Dforge.expert.infoset=true"
            fi

            echo "============================================================"
            echo "ARM: $key"
            echo "FULL SIMULATION: both players"
            echo "INFORMATION SET: $infoset"
            echo "GAMES: $GAMES_PER_ARM"
            echo "SEED: $FORGE_SEED"
            echo "============================================================"

            set +e
            (
              cd "$FORGE_HOME"
              java -Xmx3g "$jvm_flag" -jar "$FORGE_JAR" sim \
                -D "$HOME/.forge/decks/constructed" \
                -d "ST Forge Full.dck" "Benchmark Red Forge.dck" \
                -x full full \
                -n "$GAMES_PER_ARM" \
                -s "$FORGE_SEED" \
                -q -c 120
            ) 2>&1 | tee "$RESULTS/$key.log"
            local forge_exit=${PIPESTATUS[0]}
            set -e

            echo "$forge_exit" > "$RESULTS/$key.exit_code.txt"
            if [ "$forge_exit" -ne 0 ]; then
              echo "Forge failed in arm $key with exit code $forge_exit"
              exit "$forge_exit"
            fi
          }

          run_arm full_raw false
          run_arm full_infoset true

      - name: Build Stage 4 report
        run: |
          python3 forge_infoset_report.py \
            --results "$GITHUB_WORKSPACE/results/forge_expert_ai_stage4" \
            --games "$GAMES_PER_ARM" \
            --seed "$FORGE_SEED"

      - name: Save Stage 4 result
        if: always()
        run: |
          RESULTS="results/forge_expert_ai_stage4"
          if [ ! -d "$RESULTS" ]; then
            echo "No Stage 4 results directory to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULTS/"
          if git diff --cached --quiet; then
            echo "No Stage 4 result changes to save."
          else
            git commit -m "Update Forge expert-AI Stage 4 result"
            git push
          fi
