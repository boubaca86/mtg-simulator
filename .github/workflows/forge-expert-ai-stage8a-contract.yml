name: Forge Expert AI Stage 8A — Counterfactual Contract

on:
  push:
    branches: [main]
    paths:
      - 'stage8_validate_counterfactual.py'
      - 'test_stage8_validate_counterfactual.py'
      - 'stage8_serialize_counterfactual.py'
      - 'test_stage8_serialize_counterfactual.py'
      - 'stage8c_target_features.py'
      - 'stage8c_target_ranker.py'
      - 'test_stage8c_target_features.py'
      - 'stage8_label_counterfactual.py'
      - 'test_stage8_label_counterfactual.py'
      - 'patch_forge_stage8_counterfactual_capture.py'
      - 'stage8_action_ranker.py'
      - 'stage8_ranker_features.py'
      - 'stage8_legacy_ranker.py'
      - 'test_stage8_action_ranker.py'
      - 'stage7_dataset_validation.py'
      - '.github/workflows/forge-expert-ai-stage8a-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage 8A fail-closed contract regression
        run: python test_stage8_validate_counterfactual.py
      - name: Run Stage 8A deterministic serializer regression
        run: python test_stage8_serialize_counterfactual.py
      - name: Run Stage 8A live-capture grouping regression
        run: python test_stage8_label_counterfactual.py
      - name: Run contextual ranking and evaluation regressions
        run: python -m unittest -v test_stage8_action_ranker
      - name: Run typed public target regressions
        run: python -m unittest -v test_stage8c_target_features
      - name: Verify Stage 8A sources compile
        run: |
          python -m py_compile \
            stage8_validate_counterfactual.py test_stage8_validate_counterfactual.py \
            stage8_serialize_counterfactual.py test_stage8_serialize_counterfactual.py \
            stage8_label_counterfactual.py test_stage8_label_counterfactual.py \
            patch_forge_stage8_counterfactual_capture.py \
            stage8_action_ranker.py stage8_ranker_features.py \
            stage8_legacy_ranker.py test_stage8_action_ranker.py \
            stage8c_target_features.py stage8c_target_ranker.py test_stage8c_target_features.py
