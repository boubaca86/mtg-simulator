name: Stage 9P - Registered Decklist Integrity Under Real Forge Gameplay

# Read-only test-only two Python processes + actual Forge Java spell and mana canary.
# This does not promote a full Magic game, production actor, or a sandbox.
on:
  push:
    branches:
      - expert-stage9a-forge-decision-pairs
    paths:
      - .github/workflows/stage9p-forge-registered-deck.yml
      - stage9p/deck_actor.py
      - forge_tests/IsolatedForgeRegisteredDeckTest.java
      - forge_tests/verify_stage9p_surefire.py

permissions:
  contents: read

jobs:
  real-forge-registered-deck:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      STAGE9P_WORKER: ${{ github.workspace }}/stage9p/deck_actor.py
    steps:
      - name: Checkout feature branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact Forge 2.0.15
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: forge-2.0.15
          path: forge-src
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install virtual display and Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
      - name: Verify pinned SHA and stage test into disposable Forge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage9p-evidence
          test "$(git -C forge-src describe --tags --exact-match)" = forge-2.0.15
          test "$(git -C forge-src rev-parse HEAD)" = 4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676
          git -C forge-src rev-parse HEAD > stage9p-evidence/forge-sha.txt
          git rev-parse HEAD > stage9p-evidence/feature-sha.txt
          sha256sum stage9p/deck_actor.py forge_tests/IsolatedForgeRegisteredDeckTest.java \
            > stage9p-evidence/source-hashes.txt
          test -r "$STAGE9P_WORKER"
          install -m 0644 forge_tests/IsolatedForgeRegisteredDeckTest.java \
            forge-src/forge-gui-desktop/src/test/java/forge/ai/IsolatedForgeRegisteredDeckTest.java
      - name: Run actual Forge mana-paid creature spells and combat via two isolated process-backed actors
        shell: bash
        run: |
          set -euo pipefail
          cd forge-src
          rm -rf forge-gui-desktop/target/surefire-reports
          set +e
          xvfb-run -a mvn -B -ntp -pl forge-gui-desktop -am test \
            -Dtest=IsolatedForgeRegisteredDeckTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > "$GITHUB_WORKSPACE/stage9p-evidence/maven.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$GITHUB_WORKSPACE/stage9p-evidence/maven-exit.txt"
          if [ -d forge-gui-desktop/target/surefire-reports ]; then
            cp -R forge-gui-desktop/target/surefire-reports "$GITHUB_WORKSPACE/stage9p-evidence/surefire"
          fi
          echo "Forge Maven exit: $code"
          tail -n 75 "$GITHUB_WORKSPACE/stage9p-evidence/maven.log"
          test "$code" -eq 0
      - name: Verify twenty-one real Forge starting-deck, draw and priority TestNG XML results
        shell: bash
        run: |
          set -euo pipefail
          python3 forge_tests/verify_stage9p_surefire.py \
            --reports stage9p-evidence/surefire \
            | tee stage9p-evidence/gate.json
      - name: Save build, per-method XML, source hashes and gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9p-forge-registered-deck-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage9p-evidence/
          if-no-files-found: warn
          retention-days: 14
