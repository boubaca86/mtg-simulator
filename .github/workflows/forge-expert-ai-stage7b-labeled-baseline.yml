name: Forge Expert AI Stage 7B — Live Labeled Baseline

on:
  workflow_dispatch:
    inputs:
      games_per_seed:
        description: "Games per independent seed group and matchup orientation"
        required: true
        default: "4"
  push:
    branches: [main]
    paths:
      - "stage7_label_outcomes.py"
      - "stage7_value_baseline.py"
      - "stage7_semantic_value_model.py"
      - "stage7_dataset_validation.py"
      - "stage7_compare_evaluators.py"
      - "patch_forge_stage7_legal_extractor.py"
      - "patch_forge_stage7_dataset_capture.py"
      - "patch_forge_strategy_fusion_audit.py"
      - "forge_ai/RootActionTable.java"
      - "patch_forge_complete_action_identity.py"
      - "validation/Stage6RootIdentityRegression.java"
      - ".github/workflows/forge-expert-ai-stage7b-labeled-baseline.yml"

permissions:
  contents: read

concurrency:
  group: forge-expert-ai-stage7b-live
  cancel-in-progress: false

jobs:
  live-labeled-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Export decks
        run: python3 forge_export.py --user-dir "$HOME/.forge"
      - name: Clone pinned Forge
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src
      - name: Apply expert AI and legal dataset patches
        run: |
          python3 patch_forge_expert_cli.py forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python3 patch_forge_information_set.py forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          python3 patch_forge_infoset_ensemble.py --game-simulator forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python3 patch_forge_complete_action_identity.py forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java
          python3 patch_forge_strategy_fusion_audit.py --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python3 patch_forge_stage7_legal_extractor.py forge-src/forge-ai/src/main/java
          python3 patch_forge_stage7_dataset_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
      - name: Build patched Forge
        working-directory: forge-src
        run: |
          mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip=true package
          FORGE_JAR="$(find forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          echo "FORGE_JAR=$(realpath "$FORGE_JAR")" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$(realpath forge-gui)" >> "$GITHUB_ENV"
      - name: Test the real Forge action snapshot
        run: |
          javac -cp "$FORGE_JAR" -d stage6-regression validation/Stage6RootIdentityRegression.java
          java -cp "stage6-regression:$FORGE_JAR" forge.ai.simulation.Stage6RootIdentityRegression
      - name: Capture fixed benchmark seed groups
        shell: bash
        run: |
          set -euo pipefail
          : > stage7b-labeled.jsonl
          for SEED in 20261004 20261005 20261006 20261007; do
            # Stage 7D-R replication gate: four games per orientation gives 32 complete
            # games total and eight games in the seed-isolated 25% holdout.
            # Keep the asymmetric benchmark corpus: it measures the current expert search
            # against Forge Default in both deck orientations. These rows may legitimately
            # be one-sided and must not be manufactured into wins.
            for ORIENTATION in st-first red-first; do
              if [ "$ORIENTATION" = "st-first" ]; then
                DECK_A="ST Forge Full.dck"
                DECK_B="Benchmark Red Forge.dck"
                MATCHUP="st-vs-benchmark-red"
              else
                DECK_A="Benchmark Red Forge.dck"
                DECK_B="ST Forge Full.dck"
                MATCHUP="benchmark-red-vs-st"
              fi
              cd "$FORGE_HOME"
              java -Xmx6g -Dforge.expert.infoset=true -Dforge.expert.infoset.samples=3 \
                -Dforge.expert.stage7.dataset=true -Dforge.expert.stage7.matchup="$MATCHUP" \
                -jar "$FORGE_JAR" sim -D "$HOME/.forge/decks/constructed" \
                -d "$DECK_A" "$DECK_B" -x full default \
                -n "${{ inputs.games_per_seed || '4' }}" -s "$SEED" -q -c 180 \
                > "$GITHUB_WORKSPACE/stage7b-${ORIENTATION}-${SEED}.log" 2>&1
              cd "$GITHUB_WORKSPACE"
              python3 stage7_label_outcomes.py "stage7b-${ORIENTATION}-${SEED}.log" "stage7b-${ORIENTATION}-${SEED}.jsonl" --expected-games "${{ inputs.games_per_seed || '4' }}" --corpus-seed "$SEED"
              cat "stage7b-${ORIENTATION}-${SEED}.jsonl" >> stage7b-labeled.jsonl
            done

            # Mirror calibration is deferred: its original logs contain timeouts.
            # Never change seeds to force the validation gate to pass.
          done
      - name: Compare counts, visible identities, and public semantics on one fixed holdout
        run: |
          python3 stage7_compare_evaluators.py stage7b-labeled.jsonl --output stage7c-comparison.json
          python3 - <<'PY'
          import json
          r=json.load(open('stage7c-comparison.json'))
          identity=r['models']['visible_identity_hash']['holdout']
          semantics=r['models']['public_card_semantics']['holdout']
          assert len(identity['per_game']) >= 8, 'Stage 7D-R requires at least eight seed-isolated holdout games'
          assert set(identity['per_game']) == set(semantics['per_game']), 'paired holdout mismatch'
          print('Stage 7D-R holdout games:', len(identity['per_game']))
          print('semantic_minus_identity_logloss:', r['semantic_minus_identity_logloss'])
          rows=[json.loads(x) for x in open('stage7b-labeled.jsonl') if x.strip()]
          assert len({x['game_group'] for x in rows}) >= 32, 'Stage 7D-R requires 32 complete games'
          assert all(x['search_policy'] == 'fixed-root-v1' for x in rows), 'obsolete search policy'
          assert all(set(m['holdout']['per_game']) == set(identity['per_game']) for m in r['models'].values()), 'unpaired evaluator comparison'
          counts=r['models']['perspective_counts']['holdout']['game_mean_logloss']
          assert semantics['game_mean_logloss'] < counts, 'public semantics did not beat perspective counts'
          assert semantics['game_mean_logloss'] <= identity['game_mean_logloss'], 'public semantics regressed versus visible identity'
          assert r['promotion_allowed'] is False, 'offline evidence cannot promote live play'
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage7b-live-labeled-baseline
          path: |
            stage7b-labeled.jsonl
            stage7c-comparison.json
            stage7b-*.log
