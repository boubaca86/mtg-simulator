name: Forge Expert AI Stage 7B — Live Labeled Baseline

on:
  workflow_dispatch:
    inputs:
      games_per_seed:
        description: "Games per independent seed group and matchup orientation"
        required: true
        default: "4"
  push:
    branches: [main]
    paths:
      - "stage7_label_outcomes.py"
      - "stage7_compare_evaluators.py"
      - "patch_forge_stage7_legal_extractor.py"
      - "patch_forge_stage7_dataset_capture.py"
      - "patch_forge_strategy_fusion_audit.py"
      - "patch_forge_stage8_counterfactual_capture.py"
      - "stage8_label_counterfactual.py"
      - "stage8_serialize_counterfactual.py"
      - "stage8_validate_counterfactual.py"
      - "stage8_action_ranker.py"
      - "forge_ai/RootActionTable.java"
      - "patch_forge_complete_action_identity.py"
      - "validation/Stage6RootIdentityRegression.java"
      - ".github/workflows/forge-expert-ai-stage7b-labeled-baseline.yml"
permissions:
  contents: read
concurrency:
  group: forge-expert-ai-stage7b-live
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  live-labeled-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: "17"}
      - name: Export decks
        run: python3 forge_export.py --user-dir "$HOME/.forge"
      - name: Clone pinned Forge
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src
      - name: Apply expert AI and legal dataset patches
        run: |
          python3 patch_forge_expert_cli.py forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python3 patch_forge_information_set.py forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          python3 patch_forge_infoset_ensemble.py --game-simulator forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python3 patch_forge_complete_action_identity.py forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java
          python3 patch_forge_strategy_fusion_audit.py --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python3 patch_forge_stage7_legal_extractor.py forge-src/forge-ai/src/main/java
          python3 patch_forge_stage7_dataset_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python3 patch_forge_stage8_counterfactual_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
      - name: Build patched Forge
        working-directory: forge-src
        run: |
          mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip=true package
          FORGE_JAR="$(find forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          echo "FORGE_JAR=$(realpath "$FORGE_JAR")" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$(realpath forge-gui)" >> "$GITHUB_ENV"
      - name: Test the real Forge action snapshot
        run: |
          javac -cp "$FORGE_JAR" -d stage6-regression validation/Stage6RootIdentityRegression.java
          java -cp "stage6-regression:$FORGE_JAR" forge.ai.simulation.Stage6RootIdentityRegression
      - name: Capture fixed benchmark seed groups
        shell: bash
        run: |
          set -euo pipefail; : > stage7b-labeled.jsonl; : > stage8a-counterfactual.jsonl
          for SEED in 20261004 20261005 20261006 20261007; do
            for ORIENTATION in st-first red-first; do
              if [ "$ORIENTATION" = st-first ]; then DECK_A="ST Forge Full.dck"; DECK_B="Benchmark Red Forge.dck"; MATCHUP="st-vs-benchmark-red"; else DECK_A="Benchmark Red Forge.dck"; DECK_B="ST Forge Full.dck"; MATCHUP="benchmark-red-vs-st"; fi
              cd "$FORGE_HOME"
              java -Xmx6g -Dforge.expert.infoset=true -Dforge.expert.infoset.samples=3 -Dforge.expert.stage7.dataset=true -Dforge.expert.stage8.capture=true -Dforge.expert.stage7.matchup="$MATCHUP" -jar "$FORGE_JAR" sim -D "$HOME/.forge/decks/constructed" -d "$DECK_A" "$DECK_B" -x full default -n "${{ inputs.games_per_seed || '4' }}" -s "$SEED" -q -c 180 > "$GITHUB_WORKSPACE/stage7b-${ORIENTATION}-${SEED}.log" 2>&1
              cd "$GITHUB_WORKSPACE"
              python3 stage7_label_outcomes.py "stage7b-${ORIENTATION}-${SEED}.log" "stage7b-${ORIENTATION}-${SEED}.jsonl" --expected-games "${{ inputs.games_per_seed || '4' }}" --corpus-seed "$SEED"; cat "stage7b-${ORIENTATION}-${SEED}.jsonl" >> stage7b-labeled.jsonl
              python3 stage8_label_counterfactual.py "stage7b-${ORIENTATION}-${SEED}.log" "stage8-raw-${ORIENTATION}-${SEED}.jsonl" --expected-games "${{ inputs.games_per_seed || '4' }}" --corpus-seed "$SEED"
              python3 stage8_serialize_counterfactual.py "stage8-raw-${ORIENTATION}-${SEED}.jsonl" "stage8-${ORIENTATION}-${SEED}.jsonl"; python3 stage8_validate_counterfactual.py "stage8-${ORIENTATION}-${SEED}.jsonl"; cat "stage8-${ORIENTATION}-${SEED}.jsonl" >> stage8a-counterfactual.jsonl
            done
          done
          python3 stage8_validate_counterfactual.py stage8a-counterfactual.jsonl
      - name: Compare Stage 7 evaluators
        run: python3 stage7_compare_evaluators.py stage7b-labeled.jsonl --output stage7c-comparison.json
      - name: Evaluate Stage 8B seed-isolated action ranker
        run: |
          python3 stage8_action_ranker.py stage8a-counterfactual.jsonl --output stage8b-ranking.json
          python3 - <<'PY'
          import json
          r=json.load(open('stage8b-ranking.json'))
          assert r['promotion_allowed'] is False
          assert r['holdout']['decisions'] > 0
          assert r['holdout']['pairwise_comparisons'] > 0
          print('Stage 8B holdout:', r['holdout'])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage7b-live-labeled-baseline
          path: |
            stage7b-labeled.jsonl
            stage7c-comparison.json
            stage8a-counterfactual.jsonl
            stage8b-ranking.json
            stage8-*.jsonl
            stage7b-*.log
