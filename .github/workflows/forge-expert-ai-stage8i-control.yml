name: Forge Expert AI Stage 8I — Bounded Control Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patch_forge_stage8i_control_adapter.py'
      - 'stage8i_control_replay.py'
      - 'test_stage8i_control_replay.py'
      - 'validation/Stage8IBoundedControlRegression.java'
      - 'STAGE8I_BOUNDED_CONTROL.md'
      - '.github/workflows/forge-expert-ai-stage8i-control.yml'

permissions:
  contents: read
  actions: read

jobs:
  bounded-control-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Stage 8I control contract
        run: |
          python -m unittest -v \
            test_stage8i_control_replay \
            test_stage8h_lifecycle_audit \
            test_stage8f_acceptance_audit \
            test_stage8e_returned_action_audit \
            test_stage8d_shadow_policy \
            test_stage8c_target_features
          python -m py_compile \
            patch_forge_stage8i_control_adapter.py \
            stage8i_control_replay.py \
            test_stage8i_control_replay.py

      - name: Retrieve frozen Stage 8D checkpoint
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/\${GITHUB_REPOSITORY}/actions/artifacts/11405356263" --jq '.digest')" = "sha256:fdb467e0fffe365011186de647f99d38dff269281b0d2ed20748db41c9c0929d"
          gh run download 37449513507 -n stage8d-frozen-shadow-replay -D frozen-shadow
          test -s frozen-shadow/shadow-model.json

      - name: Export unchanged decks
        run: python forge_export.py --user-dir "$HOME/.forge"

      - name: Record deck hashes
        run: sha256sum "$HOME/.forge/decks/constructed/ST Forge Full.dck" "$HOME/.forge/decks/constructed/Benchmark Red Forge.dck" | tee stage8i-deck-sha256.txt

      - name: Clone pinned Forge 2.0.15
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src

      - name: Apply frozen expert-AI patches through Stage 8I
        run: |
          python patch_forge_expert_cli.py forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python patch_forge_information_set.py forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          python patch_forge_infoset_ensemble.py \
            --game-simulator forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_complete_action_identity.py forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java
          python patch_forge_strategy_fusion_audit.py \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage7_legal_extractor.py forge-src/forge-ai/src/main/java
          python patch_forge_stage7_dataset_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8_counterfactual_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8e_execution_binding.py \
            --plan forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8f_acceptance_binding.py \
            --forge-ai-java forge-src/forge-ai/src/main/java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java \
            --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java
          python patch_forge_stage8h_lifecycle.py \
            --forge-game-java forge-src/forge-game/src/main/java \
            --expert-bridge forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertActionAuditBridge.java \
            --computer-util forge-src/forge-ai/src/main/java/forge/ai/ComputerUtil.java \
            --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java \
            --magic-stack forge-src/forge-game/src/main/java/forge/game/zone/MagicStack.java
          python patch_forge_stage8i_control_adapter.py \
            --forge-ai-java forge-src/forge-ai/src/main/java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java

      - name: Build patched Forge
        working-directory: forge-src
        run: |
          mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip=true package
          FORGE_JAR="$(find forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          test -n "$FORGE_JAR"
          echo "FORGE_JAR=$(realpath "$FORGE_JAR")" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$(realpath forge-gui)" >> "$GITHUB_ENV"

      - name: Re-run safety and bounded-control regressions
        run: |
          javac -cp "$FORGE_JAR" -d stage8i-regression \
            validation/Stage6RootIdentityRegression.java \
            validation/Stage8TargetSemanticsRegression.java \
            validation/Stage8IBoundedControlRegression.java
          java -cp "stage8i-regression:$FORGE_JAR" forge.ai.simulation.Stage6RootIdentityRegression
          java -cp "stage8i-regression:$FORGE_JAR" forge.ai.simulation.Stage8TargetSemanticsRegression
          java -cp "stage8i-regression:$FORGE_JAR" forge.ai.simulation.Stage8IBoundedControlRegression valid
          java -cp "stage8i-regression:$FORGE_JAR" forge.ai.simulation.Stage8IBoundedControlRegression invalid

      - name: Capture Forge-only baseline and external requests
        shell: bash
        run: |
          set -euo pipefail
          for ORIENTATION in st-first red-first; do
            if [ "$ORIENTATION" = st-first ]; then
              DECK_A="ST Forge Full.dck"
              DECK_B="Benchmark Red Forge.dck"
              MATCHUP="st-vs-benchmark-red"
            else
              DECK_A="Benchmark Red Forge.dck"
              DECK_B="ST Forge Full.dck"
              MATCHUP="benchmark-red-vs-st"
            fi

            cd "$FORGE_HOME"
            java -Xmx10g \
              -Dforge.expert.infoset=true \
              -Dforge.expert.infoset.samples=3 \
              -Dforge.expert.stage7.dataset=true \
              -Dforge.expert.stage8.capture=true \
              -Dforge.expert.stage8.execution=true \
              -Dforge.expert.stage8.acceptance=true \
              -Dforge.expert.stage8.lifecycle=true \
              -Dforge.expert.stage7.matchup="$MATCHUP" \
              -jar "$FORGE_JAR" sim \
              -D "$HOME/.forge/decks/constructed" \
              -d "$DECK_A" "$DECK_B" \
              -x full default -n 4 -s 20261012 -q -c 600 \
              > "$GITHUB_WORKSPACE/stage8i-baseline-\${ORIENTATION}-20261012.log" 2>&1
            cd "$GITHUB_WORKSPACE"

            python stage8i_control_replay.py extract \
              "stage8i-baseline-\${ORIENTATION}-20261012.log" \
              --output "stage8i-\${ORIENTATION}.requests.tsv"
          done

      - name: Replay through bounded external control adapter
        shell: bash
        run: |
          set -euo pipefail
          for ORIENTATION in st-first red-first; do
            if [ "$ORIENTATION" = st-first ]; then
              DECK_A="ST Forge Full.dck"
              DECK_B="Benchmark Red Forge.dck"
              MATCHUP="st-vs-benchmark-red"
            else
              DECK_A="Benchmark Red Forge.dck"
              DECK_B="ST Forge Full.dck"
              MATCHUP="benchmark-red-vs-st"
            fi
            REQUEST_FILE="$GITHUB_WORKSPACE/stage8i-\${ORIENTATION}.requests.tsv"

            cd "$FORGE_HOME"
            java -Xmx10g \
              -Dforge.expert.infoset=true \
              -Dforge.expert.infoset.samples=3 \
              -Dforge.expert.stage7.dataset=true \
              -Dforge.expert.stage8.capture=true \
              -Dforge.expert.stage8.execution=true \
              -Dforge.expert.stage8.acceptance=true \
              -Dforge.expert.stage8.lifecycle=true \
              -Dforge.expert.stage8.control=true \
              -Dforge.expert.stage8.control.file="$REQUEST_FILE" \
              -Dforge.expert.stage8.control.require_forge_match=true \
              -Dforge.expert.stage7.matchup="$MATCHUP" \
              -jar "$FORGE_JAR" sim \
              -D "$HOME/.forge/decks/constructed" \
              -d "$DECK_A" "$DECK_B" \
              -x full default -n 4 -s 20261012 -q -c 600 \
              > "$GITHUB_WORKSPACE/stage8i-controlled-\${ORIENTATION}-20261012.log" 2>&1
            cd "$GITHUB_WORKSPACE"
          done

      - name: Audit exact two-pass replay equivalence
        run: |
          python stage8i_control_replay.py compare frozen-shadow/shadow-model.json \
            --baseline \
              stage8i-baseline-st-first-20261012.log \
              stage8i-baseline-red-first-20261012.log \
            --controlled \
              stage8i-controlled-st-first-20261012.log \
              stage8i-controlled-red-first-20261012.log \
            --requests \
              stage8i-st-first.requests.tsv \
              stage8i-red-first.requests.tsv \
            --expected-games 4 \
            --output stage8i-bounded-control-report.json

          python - <<'PY'
          import json
          r=json.load(open('stage8i-bounded-control-report.json'))
          t=r['totals']
          assert r['schema_version']=='stage8i-bounded-control-replay-v1'
          assert r['gate_passed'] is True
          assert r['promotion_allowed'] is False
          assert r['forge_referee'] is True
          assert r['learned_policy_controlled_gameplay'] is False
          assert r['require_forge_match'] is True
          assert t['requests'] > 0
          assert t['control_events']==t['requests']
          assert t['captures_reproduced_exactly']==t['requests']
          assert t['invalid_or_uncaptured_requests_accepted']==0
          assert t['different_from_forge_requests_accepted']==0
          assert t['returned_actions_reproduced_exactly'] > 0
          assert t['controller_acceptances_reproduced_exactly']==t['returned_actions_reproduced_exactly']
          assert t['terminal_events_reproduced_exactly']==t['returned_actions_reproduced_exactly']
          assert t['game_results_reproduced_exactly']==8
          print('Stage 8I totals:', t)
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage8i-bounded-control-replay
          path: |
            stage8i-bounded-control-report.json
            stage8i-deck-sha256.txt
            stage8i-*.requests.tsv
            stage8i-baseline-*.log
            stage8i-controlled-*.log
