name: Stage 9J - Real Forge Draw and Land with Isolated AIs

# Read-only test-only two Python process + real Forge Java rules-effect canary.
# This does not promote a full Magic game, production actor, or a sandbox.
on:
  push:
    branches:
      - expert-stage9a-forge-decision-pairs
    paths:
      - .github/workflows/stage9j-forge-draw-and-land.yml
      - stage9i/land_actor.py
      - forge_tests/IsolatedForgeDrawAndLandTest.java
      - forge_tests/verify_stage9j_surefire.py

permissions:
  contents: read

jobs:
  real-forge-land-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      STAGE9J_WORKER: ${{ github.workspace }}/stage9i/land_actor.py
    steps:
      - name: Checkout feature branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact Forge 2.0.15
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: forge-2.0.15
          path: forge-src
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install virtual display and Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
      - name: Verify pinned SHA and stage test into disposable Forge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage9j-evidence
          test "$(git -C forge-src describe --tags --exact-match)" = forge-2.0.15
          test "$(git -C forge-src rev-parse HEAD)" = 4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676
          git -C forge-src rev-parse HEAD > stage9j-evidence/forge-sha.txt
          git rev-parse HEAD > stage9j-evidence/feature-sha.txt
          sha256sum stage9i/land_actor.py forge_tests/IsolatedForgeDrawAndLandTest.java \
            > stage9j-evidence/source-hashes.txt
          test -r "$STAGE9J_WORKER"
          install -m 0644 forge_tests/IsolatedForgeDrawAndLandTest.java \
            forge-src/forge-gui-desktop/src/test/java/forge/ai/IsolatedForgeDrawAndLandTest.java
      - name: Execute genuine Forge draw and land effects with two isolated actors
        shell: bash
        run: |
          set -euo pipefail
          cd forge-src
          rm -rf forge-gui-desktop/target/surefire-reports
          set +e
          xvfb-run -a mvn -B -ntp -pl forge-gui-desktop -am test \
            -Dtest=IsolatedForgeDrawAndLandTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > "$GITHUB_WORKSPACE/stage9j-evidence/maven.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$GITHUB_WORKSPACE/stage9j-evidence/maven-exit.txt"
          if [ -d forge-gui-desktop/target/surefire-reports ]; then
            cp -R forge-gui-desktop/target/surefire-reports "$GITHUB_WORKSPACE/stage9j-evidence/surefire"
          fi
          echo "Forge Maven exit: $code"
          tail -n 75 "$GITHUB_WORKSPACE/stage9j-evidence/maven.log"
          test "$code" -eq 0
      - name: Verify five actual Forge draw-and-land results from XML
        shell: bash
        run: |
          set -euo pipefail
          python3 forge_tests/verify_stage9j_surefire.py \
            stage9j-evidence/surefire \
            | tee stage9j-evidence/gate.json
      - name: Save build, per-method XML, source hashes and gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9j-forge-draw-and-land-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage9j-evidence/
          if-no-files-found: warn
          retention-days: 14
