name: Forge Expert AI Stage 7A — Data Contract

on:
  push:
    branches: [main]
    paths:
      - 'stage7_legal_feature_contract.py'
      - 'test_stage7_legal_feature_contract.py'
      - 'STAGE7_EXPERT_VALUE_MODEL.md'
      - '.github/workflows/forge-expert-ai-stage7a-data-contract.yml'
  workflow_dispatch:

jobs:
  legal-information-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: python -m pip install pytest==8.4.2
      - name: Run deterministic and adversarial leakage tests
        run: python -m pytest -q test_stage7_legal_feature_contract.py
