name: Stage 9D — Forge Blind Exile-Pile Permission Canary

# Safe on-push Java fixture tests only. No game simulations, policy training,
# evaluation seeds, Forge source patching, or production deployment.
on:
  push:
    branches:
      - expert-stage9a-forge-decision-pairs
    paths:
      - forge_tests/BlindPileForgeBridgeTest.java
      - forge_tests/verify_stage9d_surefire.py
      - .github/workflows/stage9d-forge-blind-pile-canary.yml

permissions:
  contents: read

concurrency:
  group: stage9d-forge-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blind-pile-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout isolated Stage 9D test fixture
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned unmodified Forge 2.0.15
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: forge-2.0.15
          path: forge-src
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Forge desktop's virtual display
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
      - name: Verify revisions and install exactly six TestNG methods
        run: |
          set -euo pipefail
          mkdir -p stage9d-evidence
          test "$(git -C forge-src describe --tags --exact-match)" = forge-2.0.15
          git -C forge-src rev-parse HEAD > stage9d-evidence/forge-commit.txt
          git rev-parse HEAD > stage9d-evidence/project-commit.txt
          test "$(grep -c '@Test(timeOut = 120000)' forge_tests/BlindPileForgeBridgeTest.java)" -eq 6
          install -m 0644 forge_tests/BlindPileForgeBridgeTest.java \
            forge-src/forge-gui-desktop/src/test/java/forge/ai/BlindPileForgeBridgeTest.java
      - name: Run actual Forge Java blind-pile tests without playing matches
        run: |
          set -euo pipefail
          cd forge-src
          rm -rf forge-gui-desktop/target/surefire-reports
          set +e
          xvfb-run -a mvn -B -ntp -pl forge-gui-desktop -am test \
            -Dtest=BlindPileForgeBridgeTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > "$GITHUB_WORKSPACE/stage9d-evidence/maven.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$GITHUB_WORKSPACE/stage9d-evidence/maven-exit.txt"
          if [ -d forge-gui-desktop/target/surefire-reports ]; then
            cp -R forge-gui-desktop/target/surefire-reports \
              "$GITHUB_WORKSPACE/stage9d-evidence/"
          fi
          echo "Maven exit status: $status"
          tail -n 55 "$GITHUB_WORKSPACE/stage9d-evidence/maven.log"
      - name: Fail unless all six executed methods actually pass
        run: |
          set -euo pipefail
          test "$(cat stage9d-evidence/maven-exit.txt)" -eq 0
          python3 forge_tests/verify_stage9d_surefire.py \
            --reports stage9d-evidence/surefire-reports \
            | tee stage9d-evidence/gate.json
      - name: Preserve logs, Surefire XML, hashes, and verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9d-forge-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage9d-evidence/
          if-no-files-found: warn
          retention-days: 14
