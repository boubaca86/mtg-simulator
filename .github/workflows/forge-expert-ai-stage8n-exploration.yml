name: Forge Expert AI Stage 8N — Public Exploration Corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stage8n_exploration.py'
      - 'test_stage8n_exploration.py'
      - 'stage8n_outcome_trajectories.py'
      - 'test_stage8n_outcome_trajectories.py'
      - 'STAGE8N_EXPLORATION_CORPUS.md'
      - '.github/workflows/forge-expert-ai-stage8n-exploration.yml'

permissions:
  contents: read
  actions: read

jobs:
  public-exploration-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify predeclared Stage 8N protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          import stage8n_exploration as n

          text=Path('STAGE8N_EXPLORATION_CORPUS.md').read_text()
          assert n.DEVELOPMENT_SEEDS==tuple(range(20261034,20261042))
          assert n.RESERVED_EVALUATION_SEEDS==(20261032,20261033)
          assert set(n.DEVELOPMENT_SEEDS).isdisjoint(n.RESERVED_EVALUATION_SEEDS)
          assert n.EXPLORATION_RULE=='first-returned-public-alternative-hash-v1'
          assert '12 total applied interventions' in text
          assert '2 targeted interventions' in text
          assert '6 untargeted interventions' in text
          assert 'strength_claim_allowed=false' in text
          PY

      - name: Test Stage 8N data and control safety contracts
        run: |
          python -m unittest -v \
            test_stage8n_exploration \
            test_stage8n_outcome_trajectories \
            test_stage8l_outcome_trajectories \
            test_stage8k_return_boundary_intervention \
            test_stage8j_single_intervention \
            test_stage8i_control_replay \
            test_stage8h_lifecycle_audit \
            test_stage8f_acceptance_audit \
            test_stage8e_returned_action_audit \
            test_stage8d_shadow_policy \
            test_stage8c_target_features
          python -m py_compile \
            stage8n_exploration.py \
            stage8n_outcome_trajectories.py

      - name: Retrieve frozen Stage 8D validation checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11405356263" --jq '.digest')" = "sha256:fdb467e0fffe365011186de647f99d38dff269281b0d2ed20748db41c9c0929d"
          gh run download 37449513507 -n stage8d-frozen-shadow-replay -D frozen-shadow
          test -s frozen-shadow/shadow-model.json
          python - <<'PY'
          import json
          model=json.load(open('frozen-shadow/shadow-model.json'))
          assert model['model_id']=='6c4dd27f364aaa6c9e9100f88eb323eaa419dab0a49845ee0f748b9998746288'
          assert model['promotion_allowed'] is False
          PY

      - name: Export unchanged decks
        run: python forge_export.py --user-dir "$HOME/.forge"

      - name: Record deck hashes
        run: |
          sha256sum \
            "$HOME/.forge/decks/constructed/ST Forge Full.dck" \
            "$HOME/.forge/decks/constructed/Benchmark Red Forge.dck" \
            | tee stage8n-deck-sha256.txt

      - name: Clone pinned Forge 2.0.15
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src

      - name: Apply expert-AI patches through Stage 8K
        run: |
          python patch_forge_expert_cli.py forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python patch_forge_information_set.py forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          python patch_forge_infoset_ensemble.py \
            --game-simulator forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_complete_action_identity.py forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java
          python patch_forge_strategy_fusion_audit.py \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage7_legal_extractor.py forge-src/forge-ai/src/main/java
          python patch_forge_stage7_dataset_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8_counterfactual_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8e_execution_binding.py \
            --plan forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java \
            --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8f_acceptance_binding.py \
            --forge-ai-java forge-src/forge-ai/src/main/java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java \
            --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java
          python patch_forge_stage8h_lifecycle.py \
            --forge-game-java forge-src/forge-game/src/main/java \
            --expert-bridge forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertActionAuditBridge.java \
            --computer-util forge-src/forge-ai/src/main/java/forge/ai/ComputerUtil.java \
            --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java \
            --magic-stack forge-src/forge-game/src/main/java/forge/game/zone/MagicStack.java
          python patch_forge_stage8i_control_adapter.py \
            --forge-ai-java forge-src/forge-ai/src/main/java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8j_sparse_control.py \
            --adapter forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertPolicyControlAdapter.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8k_return_boundary_control.py \
            --adapter forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertPolicyControlAdapter.java \
            --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java

      - name: Build patched Forge
        working-directory: forge-src
        run: |
          mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip=true package
          FORGE_JAR="$(find forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          test -n "$FORGE_JAR"
          echo "FORGE_JAR=$(realpath "$FORGE_JAR")" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$(realpath forge-gui)" >> "$GITHUB_ENV"

      - name: Re-run inherited real-Forge safety regressions
        run: |
          javac -cp "$FORGE_JAR" -d stage8n-regression \
            validation/Stage6RootIdentityRegression.java \
            validation/Stage8TargetSemanticsRegression.java \
            validation/Stage8IBoundedControlRegression.java \
            validation/Stage8JSparseControlRegression.java \
            validation/Stage8KReturnBoundaryRegression.java
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage6RootIdentityRegression
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8TargetSemanticsRegression
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8IBoundedControlRegression valid
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8IBoundedControlRegression invalid
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8JSparseControlRegression missing
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8JSparseControlRegression valid
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8JSparseControlRegression wrong-actor
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression missing
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression valid
          java -cp "stage8n-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression wrong-forge

      - name: Capture Forge-only development baselines and freeze exploration requests
        shell: bash
        run: |
          set -euo pipefail
          for SEED in 20261034 20261035 20261036 20261037 20261038 20261039 20261040 20261041; do
            for ORIENTATION in st-first red-first; do
              if [ "$ORIENTATION" = st-first ]; then
                DECK_A="ST Forge Full.dck"
                DECK_B="Benchmark Red Forge.dck"
                MATCHUP="st-vs-benchmark-red"
              else
                DECK_A="Benchmark Red Forge.dck"
                DECK_B="ST Forge Full.dck"
                MATCHUP="benchmark-red-vs-st"
              fi

              cd "$FORGE_HOME"
              java -Xmx12g \
                -Dforge.expert.infoset=true \
                -Dforge.expert.infoset.samples=3 \
                -Dforge.expert.stage7.dataset=true \
                -Dforge.expert.stage8.capture=true \
                -Dforge.expert.stage8.execution=true \
                -Dforge.expert.stage8.acceptance=true \
                -Dforge.expert.stage8.lifecycle=true \
                -Dforge.expert.stage7.matchup="$MATCHUP" \
                -jar "$FORGE_JAR" sim \
                -D "$HOME/.forge/decks/constructed" \
                -d "$DECK_A" "$DECK_B" \
                -x full default -n 1 -s "$SEED" -q -c 600 \
                > "$GITHUB_WORKSPACE/stage8n-baseline-$ORIENTATION-$SEED.log" 2>&1
              cd "$GITHUB_WORKSPACE"

              python stage8n_exploration.py plan \
                frozen-shadow/shadow-model.json \
                "stage8n-baseline-$ORIENTATION-$SEED.log" \
                --corpus-seed "$SEED" \
                --actor-prefix 'Ai(1)-' \
                --output "stage8n-$ORIENTATION-$SEED.requests.tsv" \
                --metadata "stage8n-$ORIENTATION-$SEED.plan.json"
            done
          done

      - name: Run bounded Stage 8N exploration games
        shell: bash
        run: |
          set -euo pipefail
          for SEED in 20261034 20261035 20261036 20261037 20261038 20261039 20261040 20261041; do
            for ORIENTATION in st-first red-first; do
              if [ "$ORIENTATION" = st-first ]; then
                DECK_A="ST Forge Full.dck"
                DECK_B="Benchmark Red Forge.dck"
                MATCHUP="st-vs-benchmark-red"
              else
                DECK_A="Benchmark Red Forge.dck"
                DECK_B="ST Forge Full.dck"
                MATCHUP="benchmark-red-vs-st"
              fi
              REQUEST_FILE="$GITHUB_WORKSPACE/stage8n-$ORIENTATION-$SEED.requests.tsv"

              cd "$FORGE_HOME"
              if [ -s "$REQUEST_FILE" ]; then
                java -Xmx12g \
                  -Dforge.expert.infoset=true \
                  -Dforge.expert.infoset.samples=3 \
                  -Dforge.expert.stage7.dataset=true \
                  -Dforge.expert.stage8.capture=true \
                  -Dforge.expert.stage8.execution=true \
                  -Dforge.expert.stage8.acceptance=true \
                  -Dforge.expert.stage8.lifecycle=true \
                  -Dforge.expert.stage8.control=true \
                  -Dforge.expert.stage8.control.return_boundary=true \
                  -Dforge.expert.stage8.control.file="$REQUEST_FILE" \
                  -Dforge.expert.stage8.control.require_forge_match=false \
                  -Dforge.expert.stage8.control.allow_missing=true \
                  "-Dforge.expert.stage8.control.actor_prefix=Ai(1)-" \
                  -Dforge.expert.stage7.matchup="$MATCHUP" \
                  -jar "$FORGE_JAR" sim \
                  -D "$HOME/.forge/decks/constructed" \
                  -d "$DECK_A" "$DECK_B" \
                  -x full default -n 1 -s "$SEED" -q -c 600 \
                  > "$GITHUB_WORKSPACE/stage8n-controlled-$ORIENTATION-$SEED.log" 2>&1
              else
                java -Xmx12g \
                  -Dforge.expert.infoset=true \
                  -Dforge.expert.infoset.samples=3 \
                  -Dforge.expert.stage7.dataset=true \
                  -Dforge.expert.stage8.capture=true \
                  -Dforge.expert.stage8.execution=true \
                  -Dforge.expert.stage8.acceptance=true \
                  -Dforge.expert.stage8.lifecycle=true \
                  -Dforge.expert.stage7.matchup="$MATCHUP" \
                  -jar "$FORGE_JAR" sim \
                  -D "$HOME/.forge/decks/constructed" \
                  -d "$DECK_A" "$DECK_B" \
                  -x full default -n 1 -s "$SEED" -q -c 600 \
                  > "$GITHUB_WORKSPACE/stage8n-controlled-$ORIENTATION-$SEED.log" 2>&1
              fi
              cd "$GITHUB_WORKSPACE"
            done
          done

      - name: Audit deterministic public exploration boundary
        shell: bash
        run: |
          set -euo pipefail
          BASELINES=()
          CONTROLLED=()
          PLANS=()
          REQUESTS=()
          SEEDS=()
          for SEED in 20261034 20261035 20261036 20261037 20261038 20261039 20261040 20261041; do
            for ORIENTATION in st-first red-first; do
              BASELINES+=("stage8n-baseline-$ORIENTATION-$SEED.log")
              CONTROLLED+=("stage8n-controlled-$ORIENTATION-$SEED.log")
              PLANS+=("stage8n-$ORIENTATION-$SEED.plan.json")
              REQUESTS+=("stage8n-$ORIENTATION-$SEED.requests.tsv")
              SEEDS+=("$SEED")
            done
          done

          python stage8n_exploration.py compare \
            frozen-shadow/shadow-model.json \
            --baseline "${BASELINES[@]}" \
            --controlled "${CONTROLLED[@]}" \
            --plans "${PLANS[@]}" \
            --requests "${REQUESTS[@]}" \
            --corpus-seeds "${SEEDS[@]}" \
            --actor-prefix 'Ai(1)-' \
            --minimum-interventions 12 \
            --minimum-targeted-interventions 2 \
            --minimum-untargeted-interventions 6 \
            --output stage8n-exploration-safety.json

      - name: Collect Stage 8N public-only outcome trajectories
        shell: bash
        run: |
          set -euo pipefail
          LOGS=()
          for SEED in 20261034 20261035 20261036 20261037 20261038 20261039 20261040 20261041; do
            for ORIENTATION in st-first red-first; do
              LOGS+=("stage8n-controlled-$ORIENTATION-$SEED.log")
            done
          done
          python stage8n_outcome_trajectories.py \
            "${LOGS[@]}" \
            --output stage8n-outcome-trajectories.jsonl \
            --manifest stage8n-outcome-trajectory-manifest.json

      - name: Audit Stage 8N corpus gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          safety=json.loads(Path('stage8n-exploration-safety.json').read_text())
          manifest=json.loads(Path('stage8n-outcome-trajectory-manifest.json').read_text())
          rows=[
              json.loads(line)
              for line in Path('stage8n-outcome-trajectories.jsonl').read_text().splitlines()
              if line.strip()
          ]

          assert safety['schema_version']=='stage8n-public-exploration-result-v1'
          assert safety['safety_gate_passed'] is True
          assert safety['development_seeds']==list(range(20261034,20261042))
          assert safety['reserved_untouched_evaluation_seeds']==[20261032,20261033]
          totals=safety['totals']
          assert totals['games']==16
          assert totals['interventions_applied']>=12
          assert totals['targeted_interventions_applied']>=2
          assert totals['untargeted_interventions_applied']>=6
          assert totals['lifecycle_anomalies']==0
          assert totals['failed_dispatches']==0
          assert totals['invalid_requests_accepted']==0
          assert totals['pre_intervention_drift']==0

          assert manifest['schema_version']=='stage8n-outcome-trajectory-manifest-v1'
          assert manifest['games']==16
          assert manifest['trajectory_rows']==len(rows) and rows
          assert manifest['development_seed_families']==list(range(20261034,20261042))
          assert manifest['reserved_untouched_evaluation_seed_families']==[20261032,20261033]
          assert manifest['exploration_behavior_rows']==totals['interventions_applied']
          assert manifest['targeted_exploration_behavior_rows']==totals['targeted_interventions_applied']
          assert manifest['model_input_contains_search_scores'] is False
          assert manifest['model_input_contains_terminal_outcomes'] is False
          assert manifest['model_input_contains_hidden_information'] is False
          assert manifest['exploration_model_guided'] is False
          assert manifest['exploration_outcome_guided'] is False
          assert manifest['forge_referee'] is True
          assert manifest['training_performed'] is False
          assert manifest['promotion_allowed'] is False
          assert manifest['broader_learned_control_allowed'] is False
          assert manifest['strength_claim_allowed'] is False

          seeds={row['audit']['corpus_seed'] for row in rows}
          assert seeds==set(range(20261034,20261042))
          assert not ({20261032,20261033} & seeds)
          assert all(row['audit']['hidden_information_fields']==0 for row in rows)
          print('Stage 8N safety totals:', totals)
          print('Stage 8N trajectory rows:', len(rows))
          print('Stage 8N behavior sources:', manifest['behavior_source_counts'])
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage8n-public-exploration-corpus
          path: |
            stage8n-outcome-trajectories.jsonl
            stage8n-outcome-trajectory-manifest.json
            stage8n-exploration-safety.json
            stage8n-deck-sha256.txt
            stage8n-*.plan.json
            stage8n-*.requests.tsv
            stage8n-baseline-*.log
            stage8n-controlled-*.log
