name: Forge Rules Engine Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-rules-smoke
  cancel-in-progress: false

env:
  FORGE_VERSION: "2.0.15"
  FORGE_URL: "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2"

jobs:
  forge-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout simulator repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Export S.T custom cards and decks
        run: python3 forge_export.py --user-dir "$HOME/.forge"

      - name: Download Forge ${{ env.FORGE_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p forge-dist
          curl --fail --location --retry 3 --output forge.tar.bz2 "$FORGE_URL"
          tar -xjf forge.tar.bz2 -C forge-dist
          FORGE_JAR="$(find forge-dist -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          if [ -z "$FORGE_JAR" ]; then
            echo "Forge desktop jar was not found after extraction."
            find forge-dist -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "FORGE_JAR=$FORGE_JAR" >> "$GITHUB_ENV"
          echo "Forge jar: $FORGE_JAR"

      - name: Run Forge S.T rules smoke test
        run: |
          mkdir -p results/forge_smoke
          set +e
          java -Xmx2g -jar "$FORGE_JAR" sim \
            -D "$HOME/.forge/decks/constructed" \
            -d "ST Forge Smoke.dck" "Benchmark Red Forge.dck" \
            -n 20 -q -c 60 2>&1 | tee results/forge_smoke/latest.log
          FORGE_EXIT=${PIPESTATUS[0]}
          echo "$FORGE_EXIT" > results/forge_smoke/exit_code.txt
          printf '{\n  "forge_version": "%s",\n  "exit_code": %s,\n  "custom_cards": 4,\n  "games_requested": 20\n}\n' \
            "$FORGE_VERSION" "$FORGE_EXIT" > results/forge_smoke/status.json
          exit "$FORGE_EXIT"

      - name: Save Forge smoke-test log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/forge_smoke/
          if git diff --cached --quiet; then
            echo "No Forge smoke-test changes to save."
          else
            git commit -m "Update Forge rules-engine smoke result"
            git push
          fi
