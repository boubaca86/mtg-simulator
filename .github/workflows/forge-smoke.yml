name: Forge Full S.T Rules Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-rules-full-st
  cancel-in-progress: false

env:
  FORGE_VERSION: "2.0.15"
  FORGE_URL: "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/forge-installer-2.0.15.tar.bz2"
  FORGE_GAMES: "20"

jobs:
  forge-full:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout simulator repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Export full S.T custom set and decks
        run: python3 forge_export.py --user-dir "$HOME/.forge"

      - name: Download Forge ${{ env.FORGE_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p forge-dist
          curl --fail --location --retry 3 --output forge.tar.bz2 "$FORGE_URL"
          tar -xjf forge.tar.bz2 -C forge-dist

          FORGE_JAR="$(find forge-dist -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' -print -quit)"
          if [ -z "$FORGE_JAR" ]; then
            echo "Forge desktop jar was not found after extraction."
            find forge-dist -maxdepth 4 -type f | head -150
            exit 1
          fi

          LANG_FILE="$(find forge-dist -type f -path '*/res/languages/en-US.properties' -print -quit)"
          if [ -z "$LANG_FILE" ]; then
            echo "Forge language resources were not found after extraction."
            find forge-dist -maxdepth 5 -type d -name languages -print
            exit 1
          fi

          FORGE_JAR="$(realpath "$FORGE_JAR")"
          FORGE_HOME="$(dirname "$(dirname "$(dirname "$LANG_FILE")")")"
          FORGE_HOME="$(realpath "$FORGE_HOME")"

          test -f "$FORGE_HOME/res/languages/en-US.properties"
          echo "FORGE_JAR=$FORGE_JAR" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$FORGE_HOME" >> "$GITHUB_ENV"
          echo "Forge jar: $FORGE_JAR"
          echo "Forge assets directory: $FORGE_HOME"

      - name: Run full S.T deck in Forge
        run: |
          RESULTS="$GITHUB_WORKSPACE/results/forge_full"
          mkdir -p "$RESULTS"
          set +e
          (
            cd "$FORGE_HOME"
            java -Xmx2g -jar "$FORGE_JAR" sim \
              -D "$HOME/.forge/decks/constructed" \
              -d "ST Forge Full.dck" "Benchmark Red Forge.dck" \
              -n "$FORGE_GAMES" -q -c 60
          ) 2>&1 | tee "$RESULTS/latest.log"
          FORGE_EXIT=${PIPESTATUS[0]}
          set -e

          GAMES_COMPLETED=$(grep -c "Game Result: Game" "$RESULTS/latest.log" || true)
          ST_WINS=$(grep -c "Ai(1)-ST Forge Full has won" "$RESULTS/latest.log" || true)
          BENCHMARK_WINS=$(grep -c "Ai(2)-Benchmark Red Forge has won" "$RESULTS/latest.log" || true)
          DRAWS=$(grep -c "ended in a Draw" "$RESULTS/latest.log" || true)

          echo "$FORGE_EXIT" > "$RESULTS/exit_code.txt"
          printf '{\n  "forge_version": "%s",\n  "exit_code": %s,\n  "custom_cards": 11,\n  "games_requested": %s,\n  "games_completed": %s,\n  "st_wins": %s,\n  "benchmark_wins": %s,\n  "draws": %s\n}\n' \
            "$FORGE_VERSION" "$FORGE_EXIT" "$FORGE_GAMES" "$GAMES_COMPLETED" "$ST_WINS" "$BENCHMARK_WINS" "$DRAWS" > "$RESULTS/status.json"

          if [ "$FORGE_EXIT" -ne 0 ]; then
            exit "$FORGE_EXIT"
          fi
          if [ "$GAMES_COMPLETED" -ne "$FORGE_GAMES" ]; then
            echo "Forge exited normally but completed only $GAMES_COMPLETED/$FORGE_GAMES games."
            exit 2
          fi

      - name: Save Forge full-deck result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/forge_full/
          if git diff --cached --quiet; then
            echo "No Forge full-deck changes to save."
          else
            git commit -m "Update Forge full S.T rules result"
            git push
          fi
