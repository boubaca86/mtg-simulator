name: Forge Expert AI Stage 7A — Java Legal Extractor

on:
  push:
    branches: [main]
    paths:
      - "patch_forge_stage7_legal_extractor.py"
      - ".github/workflows/forge-expert-ai-stage7a-java-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-forge-extractor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Clone pinned Forge source
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src
      - name: Add Stage 7A legal-information extractor
        run: python3 patch_forge_stage7_legal_extractor.py forge-src/forge-ai/src/main/java
      - name: Enforce hidden-information boundary statically
        run: |
          F=forge-src/forge-ai/src/main/java/forge/ai/simulation/LegalDecisionFeatures.java
          grep -q 'opponent_unknown_hand_count' "$F"
          grep -q 'opponent_library_count' "$F"
          grep -q 'complete_action_identity' "$F"
          grep -q 'SECURITY BOUNDARY' "$F"
          # Count calls, not lines: the extractor may put both libraries on one line.
          # Each restricted zone must be accessed exactly once and only via size().
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('forge-src/forge-ai/src/main/java/forge/ai/simulation/LegalDecisionFeatures.java').read_text()
          compact=re.sub(r'\s+', '', source)
          for receiver, zone in [('opponent','Hand'), ('actor','Library'), ('opponent','Library')]:
              call=f'{receiver}.getCardsIn(ZoneType.{zone})'
              assert compact.count(call) == 1, f'expected one restricted-zone access: {call}'
              assert compact.count(call+'.size()') == 1, f'restricted zone read beyond its count: {call}'
          assert compact.count('getCardsIn(ZoneType.Library)') == 2, 'unexpected library access'
          print('Restricted-zone accesses are counts only.')
          PY
      - name: Compile patched Forge AI module
        working-directory: forge-src
        run: mvn -B -pl forge-ai -am -DskipTests -Dcheckstyle.skip=true package
