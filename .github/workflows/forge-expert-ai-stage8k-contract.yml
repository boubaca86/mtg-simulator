name: Forge Expert AI Stage 8K — Contract Check

on:
  pull_request:
    paths:
      - 'patch_forge_stage8k_return_boundary_control.py'
      - 'stage8k_return_boundary_intervention.py'
      - 'test_stage8k_return_boundary_intervention.py'
      - 'validation/Stage8KReturnBoundaryRegression.java'
      - 'STAGE8K_RETURN_BOUNDARY_CONTROL.md'
      - '.github/workflows/forge-expert-ai-stage8k-contract.yml'
      - '.github/workflows/forge-expert-ai-stage8k-return-boundary.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python safety tests
        run: |
          python -m unittest -v             test_stage8k_return_boundary_intervention             test_stage8j_single_intervention             test_stage8i_control_replay             test_stage8h_lifecycle_audit             test_stage8f_acceptance_audit             test_stage8e_returned_action_audit             test_stage8d_shadow_policy             test_stage8c_target_features
          python -m py_compile             patch_forge_stage8k_return_boundary_control.py             stage8k_return_boundary_intervention.py             test_stage8k_return_boundary_intervention.py

      - name: Clone pinned Forge 2.0.15
        run: git clone --depth 1 --branch forge-2.0.15 https://github.com/Card-Forge/forge.git forge-src

      - name: Apply patches through Stage 8K
        run: |
          python patch_forge_expert_cli.py forge-src/forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java
          python patch_forge_information_set.py forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java
          python patch_forge_infoset_ensemble.py             --game-simulator forge-src/forge-ai/src/main/java/forge/ai/simulation/GameSimulator.java             --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java             --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_complete_action_identity.py forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java
          python patch_forge_strategy_fusion_audit.py             --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java             --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage7_legal_extractor.py forge-src/forge-ai/src/main/java
          python patch_forge_stage7_dataset_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8_counterfactual_capture.py forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8e_execution_binding.py             --plan forge-src/forge-ai/src/main/java/forge/ai/simulation/Plan.java             --simulation-controller forge-src/forge-ai/src/main/java/forge/ai/simulation/SimulationController.java             --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8f_acceptance_binding.py             --forge-ai-java forge-src/forge-ai/src/main/java             --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java             --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java
          python patch_forge_stage8h_lifecycle.py             --forge-game-java forge-src/forge-game/src/main/java             --expert-bridge forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertActionAuditBridge.java             --computer-util forge-src/forge-ai/src/main/java/forge/ai/ComputerUtil.java             --player-controller-ai forge-src/forge-ai/src/main/java/forge/ai/PlayerControllerAi.java             --magic-stack forge-src/forge-game/src/main/java/forge/game/zone/MagicStack.java
          python patch_forge_stage8i_control_adapter.py             --forge-ai-java forge-src/forge-ai/src/main/java             --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8j_sparse_control.py             --adapter forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertPolicyControlAdapter.java             --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java
          python patch_forge_stage8k_return_boundary_control.py             --adapter forge-src/forge-ai/src/main/java/forge/ai/simulation/ExpertPolicyControlAdapter.java             --spell-picker forge-src/forge-ai/src/main/java/forge/ai/simulation/SpellAbilityPicker.java

      - name: Build Forge AI path
        working-directory: forge-src
        run: mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip=true package

      - name: Run Stage 8K Java boundary regressions
        run: |
          FORGE_JAR="$(find forge-src/forge-gui-desktop/target -type f -name '*-jar-with-dependencies.jar' -print -quit)"
          test -n "$FORGE_JAR"
          javac -cp "$FORGE_JAR" -d stage8k-regression             validation/Stage8KReturnBoundaryRegression.java
          java -cp "stage8k-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression missing
          java -cp "stage8k-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression valid
          java -cp "stage8k-regression:$FORGE_JAR" forge.ai.simulation.Stage8KReturnBoundaryRegression wrong-forge
