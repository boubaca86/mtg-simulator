name: Stage 9C — Forge Concealed Exile Permission Gate
# Test-only Forge 2.0.15 assertions. The patch applies solely in a disposable
# CI checkout; never merged, deployed, used for matches or evaluation.
on:
  push:
    branches:
      - expert-stage9a-forge-decision-pairs
    paths:
      - forge_tests/FaceDownExilePermissionBoundaryTest.java
      - forge_tests/verify_stage9c_forge_exile_surefire.py
      - forge_patches/stage9a_computer_util_ability_visibility.patch
      - .github/workflows/stage9c-forge-exile-permissions.yml
permissions:
  contents: read
concurrency:
  group: stage9c-forge-exile-permission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  permission-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Stage 9C fixtures (no credential persistence)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact upstream Forge 2.0.15
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: forge-2.0.15
          path: forge-src
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare headless Forge display
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
      - name: Verify source and install six named tests in disposable checkout
        run: |
          set -euo pipefail
          mkdir -p stage9c-forge-evidence
          test "$(git -C forge-src describe --tags --exact-match)" = "forge-2.0.15"
          git -C forge-src rev-parse HEAD > stage9c-forge-evidence/forge-source-sha.txt
          git rev-parse HEAD > stage9c-forge-evidence/project-sha.txt
          sha256sum forge_patches/stage9a_computer_util_ability_visibility.patch > stage9c-forge-evidence/proposed-patch-sha256.txt
          test "$(grep -c '@Test(timeOut = 120000)' forge_tests/FaceDownExilePermissionBoundaryTest.java)" -eq 6
          install -m 0644 forge_tests/FaceDownExilePermissionBoundaryTest.java             forge-src/forge-gui-desktop/src/test/java/forge/ai/FaceDownExilePermissionBoundaryTest.java
      - name: Apply visibility proposal only to disposable Forge checkout
        run: |
          set -euo pipefail
          git -C forge-src apply --check "$GITHUB_WORKSPACE/forge_patches/stage9a_computer_util_ability_visibility.patch"
          git -C forge-src apply "$GITHUB_WORKSPACE/forge_patches/stage9a_computer_util_ability_visibility.patch"
          git -C forge-src diff --check
          git -C forge-src diff -- forge-ai/src/main/java/forge/ai/ComputerUtilAbility.java > stage9c-forge-evidence/applied-diff.patch
      - name: Run six Forge TestNG exile-permission cases
        run: |
          set -euo pipefail
          cd forge-src
          rm -rf forge-gui-desktop/target/surefire-reports
          set +e
          xvfb-run -a mvn -B -ntp -pl forge-gui-desktop -am test             -Dtest=FaceDownExilePermissionBoundaryTest             -Dsurefire.failIfNoSpecifiedTests=false             > "$GITHUB_WORKSPACE/stage9c-forge-evidence/maven.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$GITHUB_WORKSPACE/stage9c-forge-evidence/maven-exit.txt"
          if [ -d forge-gui-desktop/target/surefire-reports ]; then
            cp -R forge-gui-desktop/target/surefire-reports               "$GITHUB_WORKSPACE/stage9c-forge-evidence/"
          fi
          echo "Maven exit $status"
          tail -n 60 "$GITHUB_WORKSPACE/stage9c-forge-evidence/maven.log"
      - name: Require Maven success and six passing TestNG methods
        run: |
          set -euo pipefail
          test "$(cat stage9c-forge-evidence/maven-exit.txt)" -eq 0
          python3 forge_tests/verify_stage9c_forge_exile_surefire.py             --reports stage9c-forge-evidence/surefire-reports             | tee stage9c-forge-evidence/verification.json
      - name: Preserve exact Forge tests, logs, hashes, XML and patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9c-forge-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage9c-forge-evidence/
          if-no-files-found: warn
          retention-days: 14
