name: Stage 9T - Guard Bids Payments and Replacement Confirmations

# Read-only test-only two Python processes + actual Forge Java spell and mana canary.
# This does not promote a full Magic game, production actor, or a sandbox.
on:
  push:
    branches:
      - expert-stage9a-forge-decision-pairs
      - expert-stage9t-rejection-test-integrity
    paths:
      - .github/workflows/stage9t-guarded-confirmations.yml
      - stage9o/combat_actor.py
      - forge_tests/Stage9TGuardedConfirmTest.java
      - forge_tests/verify_stage9t_surefire.py
      - forge_tests/stage9t_rejection_integrity.py
      - forge_tests/test_stage9t_rejection_integrity.py
  pull_request:
    paths:
      - .github/workflows/stage9t-guarded-confirmations.yml
      - stage9o/combat_actor.py
      - forge_tests/Stage9TGuardedConfirmTest.java
      - forge_tests/verify_stage9t_surefire.py
      - forge_tests/stage9t_rejection_integrity.py
      - forge_tests/test_stage9t_rejection_integrity.py

permissions:
  contents: read

jobs:
  real-forge-guarded-confirmations:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      STAGE9T_WORKER: ${{ github.workspace }}/stage9o/combat_actor.py
    steps:
      - name: Checkout feature branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Pinned historical negative control for rejection tests.
      - name: Checkout exact Forge 2.0.15
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: forge-2.0.15
          path: forge-src
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install virtual display and Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
      - name: Verify pinned SHA and stage test into disposable Forge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage9t-evidence
          test "$(git -C forge-src describe --tags --exact-match)" = forge-2.0.15
          test "$(git -C forge-src rev-parse HEAD)" = 4ec5f1a2c32fa90ecb983a72b9eb47aa5c5d7676
          git -C forge-src rev-parse HEAD > stage9t-evidence/forge-sha.txt
          git rev-parse HEAD > stage9t-evidence/feature-sha.txt
          python3 -m unittest -v forge_tests.test_stage9t_rejection_integrity
          sha256sum stage9o/combat_actor.py forge_tests/Stage9TGuardedConfirmTest.java \
            forge_tests/stage9t_rejection_integrity.py forge_tests/verify_stage9t_surefire.py \
            forge_tests/test_stage9t_rejection_integrity.py \
            > stage9t-evidence/source-hashes.txt
          test -r "$STAGE9T_WORKER"
          install -m 0644 forge_tests/Stage9TGuardedConfirmTest.java \
            forge-src/forge-gui-desktop/src/test/java/forge/ai/Stage9TGuardedConfirmTest.java
      - name: Run actual Forge mana-paid creature spells and combat via two isolated process-backed actors
        shell: bash
        run: |
          set -euo pipefail
          cd forge-src
          rm -rf forge-gui-desktop/target/surefire-reports
          set +e
          xvfb-run -a mvn -B -ntp -pl forge-gui-desktop -am test \
            -Dtest=Stage9TGuardedConfirmTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > "$GITHUB_WORKSPACE/stage9t-evidence/maven.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$GITHUB_WORKSPACE/stage9t-evidence/maven-exit.txt"
          if [ -d forge-gui-desktop/target/surefire-reports ]; then
            cp -R forge-gui-desktop/target/surefire-reports "$GITHUB_WORKSPACE/stage9t-evidence/surefire"
          fi
          echo "Forge Maven exit: $code"
          tail -n 75 "$GITHUB_WORKSPACE/stage9t-evidence/maven.log"
          test "$code" -eq 0
      - name: Verify twenty-three real Forge integrated gameplay and guarded confirmations XML cases
        shell: bash
        run: |
          set -euo pipefail
          python3 forge_tests/verify_stage9t_surefire.py \
            --reports stage9t-evidence/surefire \
            | tee stage9t-evidence/gate.json
      - name: Prove rejection tests detect a deliberately disabled validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m forge_tests.stage9t_rejection_integrity \
            --forge-root forge-src \
            --baseline-reports stage9t-evidence/surefire \
            --evidence stage9t-evidence/rejection-integrity
      - name: Save build, per-method XML, source hashes and gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9t-guarded-confirmations-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage9t-evidence/
          if-no-files-found: warn
          retention-days: 14
